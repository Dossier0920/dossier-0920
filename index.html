<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DOSSIER 0920</title>

  <style>
    body {
      background: #111;
      color: #e8e1cf;
      font-family: "Courier New", monospace;
      text-align: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      border: 1px solid #777;
      padding: 40px;
      background: #191919;
    }

    h1 {
      letter-spacing: 5px;
      font-size: 36px;
      margin-bottom: 5px;
    }

    h2 {
      font-weight: normal;
      font-size: 17px;
      color: #aaa;
    }

    .classified {
      display: inline-block;
      border: 3px solid #9c1c1c;
      color: #c22929;
      padding: 7px 15px;
      margin: 25px;
      font-weight: bold;
      transform: rotate(-3deg);
    }

    .menu-button {
      display: block;
      width: 80%;
      max-width: 400px;
      margin: 18px auto;
      padding: 17px;
      background: #262626;
      border: 1px solid #aaa;
      color: white;
      text-decoration: none;
      font-family: "Courier New", monospace;
      font-size: 16px;
      cursor: pointer;
    }

    .menu-button:hover {
      background: #333;
    }

    .footer {
      margin-top: 35px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>DOSSIER 0920</h1>

    <h2>SECURE RECORDS SYSTEM</h2>

    <div class="classified">
      CLASSIFIED
    </div>

    <p>AUTHORIZED PERSONNEL ONLY</p>

    <button class="menu-button">
      HOTEL GUEST REGISTRY
    </button>

    <button class="menu-button">
      HISTORICAL INTELLIGENCE ARCHIVES
    </button>

    <div class="footer">
      PARIS FIELD OPERATIONS<br>
      SECURITY LEVEL 7
    </div>

  </div>

</body>
</html>
