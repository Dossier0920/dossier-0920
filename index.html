<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOSSIER 0920</title>

<style>

body {
    background-color: #111;
    color: #e7dfcc;
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 25px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #181818;
    border: 1px solid #777;
    padding: 35px;
    box-shadow: 0 0 25px black;
}

h1 {
    text-align: center;
    letter-spacing: 5px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 20px;
}

.classified {
    width: fit-content;
    margin: 20px auto;
    padding: 7px 15px;
    border: 3px solid #9e2424;
    color: #c53636;
    font-weight: bold;
    transform: rotate(-3deg);
}

.menu-button {
    display: block;
    width: 90%;
    margin: 15px auto;
    padding: 16px;
    background: #262626;
    border: 1px solid #aaa;
    color: white;
    font-family: "Courier New", monospace;
    cursor: pointer;
    font-size: 16px;
}

.menu-button:hover {
    background: #353535;
}

.section {
    display: none;
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid #555;
}

input {
    width: 90%;
    padding: 14px;
    margin: 12px 0;
    background: #0e0e0e;
    border: 1px solid #777;
    color: white;
    font-family: "Courier New", monospace;
    font-size: 18px;
}

.search-button {
    padding: 12px 25px;
    background: #333;
    color: white;
    border: 1px solid #aaa;
    font-family: "Courier New", monospace;
    cursor: pointer;
}

.result {
    margin-top: 25px;
    text-align: left;
    line-height: 1.6;
    border-left: 4px solid #8c2323;
    padding: 15px;
    background: #101010;
    display: none;
}

.alert {
    color: #d34a4a;
    font-weight: bold;
}

.record-title {
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.back {
    margin-top: 25px;
    color: #aaa;
    cursor: pointer;
    text-decoration: underline;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    margin-top: 40px;
}

</style>
</head>

<body>

<div class="container">

<h1>DOSSIER 0920</h1>

<div class="subtitle">
SECURE RECORDS SYSTEM
</div>

<div class="classified">
CLASSIFIED
</div>

<div id="mainMenu">

<p style="text-align:center">
AUTHORIZED PERSONNEL ONLY
</p>

<button class="menu-button" onclick="openHotel()">
HOTEL GUEST REGISTRY
</button>

<button class="menu-button">
HISTORICAL INTELLIGENCE ARCHIVES
</button>

</div>


<div id="hotelSection" class="section">

<h2>HOTEL GUEST REGISTRY</h2>

<p>
Search archived guest records by room number.
</p>

<input
type="text"
id="roomNumber"
placeholder="ENTER ROOM NUMBER">

<br>

<button
class="search-button"
onclick="searchHotel()">
SEARCH RECORDS
</button>

<div id="hotelResult" class="result"></div>

<div class="back" onclick="goBack()">
← RETURN TO SECURE RECORDS
</div>

</div>


<div class="footer">
PARIS FIELD OPERATIONS<br>
SECURITY LEVEL 7
</div>

</div>


<script>

function openHotel() {

    document.getElementById("mainMenu").style.display = "none";

    document.getElementById("hotelSection").style.display = "block";

}


function goBack() {

    document.getElementById("mainMenu").style.display = "block";

    document.getElementById("hotelSection").style.display = "none";

    document.getElementById("hotelResult").style.display = "none";

    document.getElementById("roomNumber").value = "";

}


function searchHotel() {

    let room =
    document.getElementById("roomNumber").value.trim();

    let result =
    document.getElementById("hotelResult");

    result.style.display = "block";


    // IMPORTANT STORY ROOM
    if (room === "323") {

        result.innerHTML = `

        <div class="alert">
        SECURITY REVIEW — FLAGGED RECORD
        </div>

        <br>

        <div class="record-title">
        ROOM 323
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        V. Beaumont

        <br>

        <strong>RESIDENCE:</strong>
        Paris, France

        <br><br>

        <strong>VISITOR LOG:</strong>

        <br>

        Sergei Antonov

        <br>

        Arrival: 10:14 PM

        <br>

        Departure: 11:06 PM

        <br><br>

        Visitor admitted at guest's request.

        <br><br>

        <strong>INTERNAL NOTE:</strong>

        <br>

        Guest requested that no telephone calls
        be connected to the room during the visit.

        <br><br>

        Visitor entry was recorded manually
        by the night desk.

        <br><br>

        <span class="alert">
        ASSOCIATED VISITOR LATER FLAGGED
        IN INTELLIGENCE RECORDS.
        </span>

        `;

    }


    // DOSSIER 0920 EASTER EGG
    else if (room === "920") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 920
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        C. Dorsey

        <br>

        <strong>STATUS:</strong>
        VIP GUEST

        <br><br>

        <strong>INTERNAL NOTE:</strong>

        <br>

        Special authorization granted.

        <br><br>

        Clearance level:
        <strong>7</strong>

        <br><br>

        <span class="alert">
        LICENSED FOR LEVEL 7 ACCESS
        </span>

        `;

    }


    // SECRET 092 EASTER EGG
    else if (room === "092") {

        result.innerHTML = `

        <div class="alert">
        ARCHIVE ANOMALY DETECTED
        </div>

        <br>

        <div class="record-title">
        ROOM 092
        </div>

        <br>

        Room number not recognized
        as a valid guest room.

        <br><br>

        <strong>CROSS-REFERENCE:</strong>
        DOSSIER 0920

        <br>

        <strong>REQUIRED CLEARANCE:</strong>
        AGENT 007

        <br><br>

        <span class="alert">
        FURTHER INFORMATION CLASSIFIED
        </span>

        `;

    }


    // NORMAL HOTEL RECORD
    else if (room === "602") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 602
        </div>

        <br>

        <strong>STATUS:</strong>
        VACANT

        <br><br>

        Room held for maintenance.

        `;

    }


    else if (room === "605") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 605
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        Claire Duvall

        <br>

        <strong>RESIDENCE:</strong>
        Lyon, France

        <br><br>

        <strong>STATUS:</strong>
        No security flags.

        `;

    }


    else if (room === "607") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 607
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        Henry Whitmore

        <br>

        <strong>RESIDENCE:</strong>
        London, England

        <br><br>

        Guest requested early departure
        at 6:15 AM.

        <br><br>

        <strong>STATUS:</strong>
        No security flags.

        `;

    }


    else if (room === "609") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 609
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        Paul Fournier

        <br>

        <strong>RESIDENCE:</strong>
        Marseille, France

        <br><br>

        <strong>STATUS:</strong>
        Reservation canceled prior to arrival.

        `;

    }


    // SMALL RED HERRING
    else if (room === "611") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 611
        </div>

        <br>

        <strong>ARCHIVE STATUS:</strong>
        INCOMPLETE

        <br><br>

        Passport photocopy missing
        from archived registration materials.

        <br><br>

        No additional irregularities recorded.

        `;

    }


    else if (room === "616") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 616
        </div>

        <br>

        <strong>STATUS:</strong>
        VACANT

        `;

    }


    // SPY-SOUNDING RED HERRING
    else if (room === "618") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 618
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        Jacques Moreau

        <br>

        <strong>RESIDENCE:</strong>
        Nice, France

        <br><br>

        <strong>GUEST REQUEST:</strong>

        <br>

        No telephone calls were to be
        connected directly to the room.

        <br><br>

        <strong>STATUS:</strong>
        No security flags.

        `;

    }


    else if (room === "621") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 621
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        Elizabeth Harcourt

        <br>

        <strong>RESIDENCE:</strong>
        New York, USA

        <br><br>

        <strong>STATUS:</strong>
        No security flags.

        `;

    }


    else if (room === "624") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 624
        </div>

        <br>

        <strong>ARCHIVE STATUS:</strong>

        <br>

        RECORD UNAVAILABLE

        <br><br>

        Original registration materials
        damaged during archival transfer.

        `;

    }


    // ANOTHER RED HERRING
    else if (room === "627") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 627
        </div>

        <br>

        <strong>REGISTERED GUEST:</strong>
        André Laurent

        <br>

        <strong>RESIDENCE:</strong>
        Geneva, Switzerland

        <br><br>

        Guest settled entire account
        in cash at departure.

        <br><br>

        <strong>STATUS:</strong>
        No security flags.

        `;

    }


    else if (room === "631") {

        result.innerHTML = `

        <div class="record-title">
        ROOM 631
        </div>

        <br>

        <strong>STATUS:</strong>
        VACANT

        `;

    }


    // ANY OTHER NUMBER
    else {

        result.innerHTML = `

        <span class="alert">
        NO MATCHING ARCHIVED RECORD FOUND
        </span>

        <br><br>

        Verify the room number
        and search again.

        `;

    }

}

</script>

</body>
</html>
